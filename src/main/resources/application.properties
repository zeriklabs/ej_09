spring.application.name=bas

# ==========================================
# Configuración de Base de Datos
# Por defecto conecta a MySQL local, pero permite PostgreSQL en la nube (Render)
# Spring Boot detecta automáticamente el driver y el dialecto según la URL.
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/security_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Configuración JWT (Paso 8 y 9)
# ==========================================
# Llave de 256 bits codificada en hexadecimal
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# Tiempo de expiración en milisegundos (1 hora = 3600000 ms)
security.jwt.expiration-time=3600000
